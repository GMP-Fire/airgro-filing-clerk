name: Backlog Sweep

# NO SCHEDULE, DELIBERATELY.
# This workflow can move thousands of messages to Trash. It runs only when a human
# clicks Run workflow. Adding a cron here would be a mistake.
on:
  workflow_dispatch:
    inputs:
      sweep:
        description: "Actually move mail to Trash. Leave OFF to just count."
        type: boolean
        default: false
      only_senders:
        description: "Comma-separated fragments, e.g. takealot,superbalist. Blank = all."
        type: string
        default: ""
      max_senders:
        description: "Cap on how many senders to process. 0 = no limit."
        type: string
        default: "0"
      max_sweep:
        description: "Hard cap on messages trashed in this run. 0 = no limit. Use 500 first."
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: backlog-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sweep backlog
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Separate from GOOGLE_REFRESH_TOKEN on purpose. The nightly Filing Clerk's
          # token is read-only and must stay that way.
          GOOGLE_REFRESH_TOKEN_SWEEP: ${{ secrets.GOOGLE_REFRESH_TOKEN_SWEEP }}
          SWEEP: ${{ inputs.sweep && '1' || '0' }}
          ONLY_SENDERS: ${{ inputs.only_senders }}
          MAX_SENDERS: ${{ inputs.max_senders || '0' }}
          MAX_SWEEP: ${{ inputs.max_sweep || '0' }}
        run: python backlog_sweep.py
