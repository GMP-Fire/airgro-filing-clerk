name: Build Folder Registry

# Manual only. The last title walk: captures folder ids into
# _AI Systems/claude-system/folder-registry.json (never overwrites one), and the
# one-shot rewrite of filing-rules.json dests from paths to registry keys.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = print only; write = create the registry; migrate-rules = rewrite rule dests as keys"
        type: choice
        options: [preview, write, migrate-rules]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build registry
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            write) python build_registry.py --write ;;
            migrate-rules) python build_registry.py --migrate-rules ;;
            *) python build_registry.py ;;
          esac
