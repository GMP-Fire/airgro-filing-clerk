name: Inbox Archive

# NO SCHEDULE, DELIBERATELY.
# This can move tens of thousands of messages out of the inbox. It runs only when a
# human clicks Run workflow. It never trashes and never touches unread mail, but a
# cron here would still be a mistake.
on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Actually archive. Leave OFF to just count."
        type: boolean
        default: false
      before:
        description: "Archive mail older than this (YYYY/MM/DD). Blank = 12 months ago."
        type: string
        default: ""
      max_archive:
        description: "Cap on messages archived in this run. 0 = no limit. Use 500 first."
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: inbox-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Archive old inbox mail
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # The same write-scoped token as the Backlog Sweep. The nightly Filing
          # Clerk's token stays read-only and must not be used here.
          GOOGLE_REFRESH_TOKEN_SWEEP: ${{ secrets.GOOGLE_REFRESH_TOKEN_SWEEP }}
          ARCHIVE: ${{ inputs.archive && '1' || '0' }}
          BEFORE: ${{ inputs.before }}
          MAX_ARCHIVE: ${{ inputs.max_archive || '0' }}
        run: python inbox_archive.py
