name: Drive to Dropbox

# Manual, one-off (Drive v2 Phase 2.2). COPIES a Drive folder into the Airgro
# Dropbox and verifies every file by content hash. Never touches Drive.
on:
  workflow_dispatch:
    inputs:
      copy:
        description: "Copy for real. Leave OFF to see the plan."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drive-to-dropbox
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
        run: python drive_to_dropbox.py ${{ inputs.copy && '--copy' || '' }}
      - if: always() && inputs.copy
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest
          path: migration-manifest.csv
          if-no-files-found: ignore
